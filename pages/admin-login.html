<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Staff Login — O'Conor Home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../src/styles/main.css" />
</head>

<body>

  <header>
    <div class="logo">
      <a href="../index.html">
        <img src="../src/assets/images/logo.png" alt="O'Conor Home" />
      </a>
    </div>
    <nav aria-label="Main navigation">
      <ul>
        <li><a href="../index.html">← Back to website</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="admin-login-section">
      <div class="admin-login-inner">
        <img src="../src/assets/images/logo.png" alt="O'Conor Home" style="height:60px;margin:0 auto 1.5rem;" />
        <h1>Staff Login</h1>
        <p>Sign in to manage the O'Conor Home website.</p>

        <form id="login-form">
          <div class="form-group">
            <label for="login-email">Email</label>
            <input type="email" id="login-email" placeholder="your@email.com" required />
          </div>
          <div class="form-group">
            <label for="login-password">Password</label>
            <input type="password" id="login-password" placeholder="Your password" required />
          </div>
          <div id="login-error"></div>
          <button type="submit" style="width:100%;">Sign In</button>
        </form>
      </div>
    </section>
  </main>

  <script type="module" src="../src/scripts/admin-login.ts"></script>

</body>
</html>
